name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: actions-runner
    steps:
      - uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "User: $(whoami)"
          echo "OS: $(cat /etc/os-release | head -1)"
          echo "Disk: $(df -h / | tail -1)"
          echo "Memory: $(free -m | grep Mem)"
          echo "Sudo: $(sudo -n echo OK 2>&1 || echo FAIL)"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev
          sudo apt-get clean
          echo "Disk after install: $(df -h / | tail -1)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci + build frontend
        run: |
          npm ci
          npm run build:frontend

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
        timeout-minutes: 10

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri
        timeout-minutes: 5

  release:
    if: github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: actions-runner
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
          sudo apt-get clean

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build release
        run: npm run tauri build
        timeout-minutes: 30
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
